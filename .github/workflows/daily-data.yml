name: Refresh ETF data

on:
  schedule:
    # A 股收盘后首抓：12:40 UTC = 20:40 北京时间
    - cron: "40 12 * * 1-5"
    # 次日早晨补抓前一日未披露的深交所数据：01:00 UTC = 09:00 北京时间
    - cron: "0 1 * * 2-6"
  workflow_dispatch:
    inputs:
      refresh_days:
        description: "回刷最近多少个自然日"
        required: false
        default: "21"
      deploy:
        description: "是否部署到 Cloudflare Pages"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-etf-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          npm ci

      - name: Fetch and validate data
        env:
          # 允许 >20% 的份额突变先发布、后复核；>3 倍仍视为数据异常硬失败
          ALLOW_UNREVIEWED_MOVES: "1"
          MAX_UNREVIEWED_MOVE: "3.0"
        run: python scripts/update_data.py --refresh-days "${{ inputs.refresh_days || '21' }}"

      - name: Test and build
        run: |
          npm test
          python scripts/check_freshness.py --source local --max-lag-trading-days 1
          npm run build

      - name: Commit refreshed data
        if: github.ref == 'refs/heads/main'
        run: |
          git add public/data/etf-shares.csv public/data/etf-shares.json
          if git diff --cached --quiet; then
            echo "No generated data changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: refresh ETF shares"
            git push
          fi

      # 用 GITHUB_TOKEN 推送不会触发其他 workflow，所以这里直接部署
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.deploy)
        run: >-
          npx --yes wrangler@4.118.0 pages deploy dist
          --project-name csi300-etf-shares
          --branch main
          --commit-hash "$(git rev-parse HEAD)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Open issue for unreviewed moves
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY' > /tmp/unreviewed.md
          import json, pathlib
          meta = json.loads(pathlib.Path("public/data/etf-shares.json").read_text("utf-8"))["metadata"]
          moves = meta.get("unreviewed_moves") or []
          if not moves:
              print("NONE")
          else:
              print("自动刷新检测到未复核的大额份额变动，已先行发布，请核对后加入 KNOWN_LARGE_MOVES：\n")
              for m in moves:
                  print(f"- {m['code']} {m['date']}：{m['previous_shares_100m']} → {m['current_shares_100m']} 亿份（{m['change_pct']:+.2f}%）")
          PY
          if grep -q "^NONE$" /tmp/unreviewed.md; then exit 0; fi
          TITLE="[data] 待复核：未登记的大额份额变动"
          BODY="$(cat /tmp/unreviewed.md)"
          if gh issue list --state open --search "$TITLE in:title" | grep -q .; then
            gh issue comment "$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="[pipeline] 每日刷新失败"
          BODY="工作流失败：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}（触发方式：${{ github.event_name }}）"
          if gh issue list --state open --search "$TITLE in:title" | grep -q .; then
            gh issue comment "$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
